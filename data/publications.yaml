- title: "SpecPrune-VLA: Accelerating Vision-Language-Action Models via Action-Aware Self-Speculative Pruning"
  authors:
    - Hanzhen Wang
    - Jiaming Xu
    - Yushun Xiang
    - Jiayi Pan
    - Yongkang Zhou
    - Yong-Lu Li
    - Guohao Dai
  venue: International Conference on Machine Learning (ICML)
  venue_short: ICML 2026
  highlight: true
  year: 2026
  image: images/pubs/specprune.png
  tldr: >-
    A training-free, two-level token pruning scheme for VLA policies: action-level static pruning plus
    layer-level dynamic pruning, steered by an action-aware controller, for faster inference at near-identical success rates.
  links:
    paper: https://arxiv.org/abs/2509.05614
    code: https://github.com/alexwhz-sjtu/SpecPrune-VLA
