- title: "RoboICL: Embodied In-Context Learning with GPT-6 Astra"
  authors:
    - Fangcheng Liu*
    - Yeqing Shen*
    - Anda Cheng*
    - Weishi Mi
    - Chao Tang
    - Chenyuan Liu
    - Yushun Xiang
    - Tingguang Li
    - Yong-Lu Li
    - Yehui Tang
  venue: arXiv preprint
  venue_short: Preprint 2026
  year: 2026
  image: images/pubs/roboicl.png
  tldr: >-
    Drives a frozen GPT-6 Astra as a few-shot robot learner using demonstration context and a bounded,
    anchored interaction memory, with no robot-specific training.
  links:
    paper: https://arxiv.org/abs/2609.34261
    code: https://github.com/Mosi-AI/RoboICL
    website: https://mosi-ai.github.io/RoboICL-GPT6-Astra.github.io/

