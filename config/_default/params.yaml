# HugoBlox configuration (schema v2)
# Docs: https://docs.hugoblox.com/
# The homepage (layouts/home.html) is custom and only reads `identity.description`;
# everything else here styles the theme-rendered pages (posts, tags, 404).
hugoblox:
  schema: "2.0"

  identity:
    name: "Yushun Xiang"
    organization: ""
    type: person
    tagline: ""
    description: "Yushun Xiang’s academic homepage: master’s student at SJTU working on embodied AI, robot learning, and vision-language-action models."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: "#0f6e63"
      secondary: ""
      neutral: ""

  typography:
    pack: "academic"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} {name}."
    license:
      type: custom

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true

  search:
    enable: false

  comments:
    enable: false

  repository:
    enable: false
    url: "https://github.com/YushunXiang/yushunxiang.github.io"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us
